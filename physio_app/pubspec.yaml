name: physio_app
description: PhysioConnect – Physiotherapist App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  pin_code_fields: ^8.0.1
  geolocator: ^11.0.0
  google_maps_flutter: ^2.6.1
  firebase_core: ^2.30.1
  firebase_messaging: ^14.9.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
