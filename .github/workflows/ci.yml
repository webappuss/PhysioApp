name: PhysioConnect CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend (Laravel) ────────────────────────────────────────────────────
  backend:
    name: Laravel Tests
    runs-on: ubuntu-22.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: physioconnect_test
          MYSQL_USER: physio
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: rootsecret
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, zip, bcmath, redis, gd, intl, opcache
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        working-directory: backend
        run: |
          cp .env.example .env
          sed -i 's/APP_ENV=production/APP_ENV=testing/' .env
          sed -i 's/APP_DEBUG=false/APP_DEBUG=true/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=physioconnect/DB_DATABASE=physioconnect_test/' .env
          sed -i 's/DB_USERNAME=/DB_USERNAME=physio/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=secret/' .env
          sed -i 's/REDIS_PASSWORD=null/REDIS_PASSWORD=/' .env
          php artisan key:generate

      - name: Run migrations
        working-directory: backend
        run: php artisan migrate --force

      - name: Run seeders
        working-directory: backend
        run: php artisan db:seed --force

      - name: Run PHPUnit tests
        working-directory: backend
        run: php artisan test --parallel

  # ── Admin Panel (React + TypeScript) ────────────────────────────────────
  admin:
    name: Admin Panel Build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin_panel/package-lock.json

      - name: Install dependencies
        working-directory: admin_panel
        run: npm ci

      - name: Type check
        working-directory: admin_panel
        run: npx tsc --noEmit

      - name: Build
        working-directory: admin_panel
        run: npm run build
        env:
          VITE_API_URL: https://api.physioconnect.in/api/v1

  # ── Docker image build check ─────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-22.04
    needs: [backend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
